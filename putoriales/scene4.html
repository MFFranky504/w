const PW_LIE=V(0,2.35,-0.4),PW_SIT=V(0,2.0,-1.5),PW_STAND=V(0,3.45,-1.5);
const tmpQ=new THREE.Quaternion(),tmpQ2=new THREE.Quaternion();
function applyHero(t){
  // pose phases: 0 lying, 1 sitting, 2 standing on bed
  let rx=-Math.PI/2,a=0,pw=PW_LIE.clone();
  const sit=eback(seg(t,T_SIT,T_SIT+0.7)), stand=eio(seg(t,T_STAND,T_STAND+0.8));
  const yank=eio(seg(t,T_YANK,T_YANK+0.28));
  if(t<T_YANK){
    const s=clamp(sit,0,1.15);
    rx=lerp(-Math.PI/2,0,s);a=lerp(0,Math.PI/2,s);pw=PW_LIE.clone().lerp(PW_SIT,s);
    rx=lerp(rx,0,0);a=lerp(a,0,stand);pw.lerp(PW_STAND,stand);
  }else{
    rx=lerp(0,-Math.PI/2,yank);a=0;pw=PW_STAND.clone().lerp(PW_LIE,yank);
  }
  const rxw=rx;

  hero.position.set(pw.x,pw.y-1.8*Math.cos(rxw),pw.z-1.8*Math.sin(rxw));
  // yank stretch / snore
  const st=t>=T_YANK&&t<T_YANK+0.6?Math.sin((t-T_YANK)/0.6*Math.PI)*0.35:0;
  hero.scale.set(1-0.5*st,1+st,1-0.5*st);
  const snore=t>=K('regrese')?0.03*Math.sin(t*2.2):0;
  // legs: lying a=0; sitting thigh forward; leg gag
  const legK=eio(seg(t,T_LEG,T_LEG+0.5))*(1-eio(seg(t,T_LEGBACK,T_LEGBACK+0.3)));
  legs.forEach((l,i)=>{
    const out=i===1?legK:0;
    l.th.rotation.set(-a,0,-out*1.35);l.kn.rotation.set(a*0,0,0);
    const ex=1+out*1.4;l.th.scale.y=ex;l.kn.scale.y=ex;
    if(out>0.2){l.kn.rotation.x=0.5*out}
  });
  torsoP.rotation.x=0;
  const cx=t>=K('felicidades')?0:1;
  arms.forEach((g,i)=>{const s=i?1:-1;g.rotation.z=s*(0.12+(t>=T_STAND&&t<T_YANK?0.4:0));g.rotation.x=-0.1+0.05*Math.sin(t*1.3+i)+(t>=T_YANK-0.1&&t<T_YANK+0.4?-1.2:0)});
  headP.position.y=1.7;headP.rotation.set(0.03*Math.sin(t*1.2)+snore,0,0.04*Math.sin(t*1.4));
  skinM.color.copy(SKINC).lerp(PALE,t<T_HOOKEND?0.45:0.1);
  // eyes
  let blink=0;for(const b of blinks){const d=t-b;if(d>0&&d<0.14)blink=Math.sin(d/0.14*Math.PI)}
  const asleep=t>=K('regrese')+0.6?1:0;
  eyeRig.forEach(r=>{
    const opens=r.s<0?T_EYE1:T_EYE2; // first eye, then the other
    const o=t<K('primero')?0:eio(seg(t,opens,opens+0.25));
    const closedLid=(t<K('primero'))?1.4:(1.4*(1-o));
    r.lid.rotation.x=0.18+closedLid*(1-0)+1.2*blink*(t>=K('primero')?1:0)+1.2*asleep-0.8*(t>=T_EYE2&&t<T_EYE2+0.5?1:0);
    r.e.scale.setScalar(1+(t>=T_EYE2&&t<T_EYE2+0.5?0.35:0)+(t>=T_STAND&&t<T_YANK?0.3:0));
    r.pup.visible=true;r.spiral.visible=false;
    r.pup.position.set(0,t>=K('quede')&&t<K('hijo')?0.12:0,0.25);
    r.brow.rotation.z=r.s*0.18;r.brow.position.y=0.62;r.bag.scale.set(1.1,0.55,0.45);
  });
  const w=wordAt(TN);let open=0;if(w)open=0.3+0.7*Math.abs(Math.sin((TN-w[1])*21));
  mouth.scale.set(0.3,0.03+0.2*open+(asleep?0.1:0),0.14);drool.visible=t<K('cómo')||asleep>0;drool.scale.y=0.7+0.3*Math.sin(t*6);
  hero.updateMatrixWorld(true);head.getWorldPosition(HP);hero.getWorldPosition(HEROPOS);
  // beard: lies along body, then stands up in world space ("se levantó") and stays
  const erect=eio(seg(t,T_ERECT,T_ERECT1));
  head.getWorldQuaternion(tmpQ).invert();
  tmpQ2.setFromAxisAngle(V(1,0,0),Math.PI);
  const sway=0.15*Math.sin(t*5)*erect;
  const hang=tmpQ2.clone();const up=tmpQ.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(sway,0,0.75+sway*0.8)));
  beard.quaternion.copy(hang.slerp(up,erect));
  const bl=t<T_ERECT?1.9:lerp(1.9,1.1,seg(t,T_ERECT,T_ERECT1+0.3));beard.scale.set(0.7,bl,0.7);
}

function applyProps(t){
  // day/night flicker in hook, night after
  const hook=t<T_HOOKEND;
  const k=hook?0.5+0.5*Math.sin(t*8):0;
  sky.material.color.setHex(0x0e1040).lerp(new THREE.Color(0x7ec8ff),k);
  moon.visible=k<0.5;moonL.intensity=1.9+1.2*k;
  scene.background.setHex(0x1b1d5a).lerp(new THREE.Color(0x6a7ac0),k*0.6);
  // clock
  let txt='48:00',on=true;
  if(hook)txt=String(48-Math.floor(t*3)).padStart(2,'0')+':'+String(Math.floor(t*37)%60).padStart(2,'0');
  else if(t<K('regrese'))txt='48:00';else txt='03:00';
  if(t>=K('regrese'))on=Math.floor(t*2)%2===0;
  drawClock(txt,on);
  // bed face reacts
  const sad=seg(t,K('suelta')-0.5,K('suelta')+0.2);
  bedEyes.forEach(b=>b.p.position.set(0.04*Math.sin(t*2),-0.08-0.05*sad,0.3));
  tear.visible=sad>0.5;tear.position.y=1.1-0.9*((t*0.9)%1);
  bedBrows.forEach((b,i)=>b.rotation.z=(i?1:-1)*(0.25+0.4*sad));
  bedMouth.rotation.z=sad>0.5?0:Math.PI;bedMouth.position.y=sad>0.5?0.6:0.72;
  moonMouth.scale.set(1,1+0.8*Math.abs(Math.sin(t*1.1)),1);
  // bed hands
  HANDS.forEach((g,i)=>{
    const on=t>=K('despacio')-0.1&&t<K('felicidades');g.visible=on;if(!on)return;
    const k=eback(seg(t,K('despacio')-0.1+0.1*i,K('despacio')+0.3+0.1*i));
    let p=g.userData.home;let x=p[0],y=p[1],z=p[2];
    if(t>=T_STAND&&t<K('felicidades')&&i<2){x=(i?0.45:-0.45);y=1.75;z=-1.5}
    g.position.set(x,y-1.4*(1-k),z);
    g.children.forEach(c=>{if(c.userData.f!==undefined)c.rotation.x=-0.3-0.6*Math.max(0,Math.sin(t*6+c.userData.f))*(t>=T_STAND?0.2:1)});
  });
  // zzz
  ZZ.forEach((m,i)=>{const on=t>=K('regrese')+0.4;m.visible=on;if(!on)return;const d=((t-K('regrese'))*0.8+i/3)%1;
    m.position.set(HP.x+0.4+d*1.5,HP.y+1.2+d*4,HP.z+0.4);m.quaternion.copy(cam.quaternion);m.scale.setScalar(0.6+d*1.0);m.material.opacity=1-d});
  // sheep: sleep on hero, hop off at sit
  SHEEP.forEach((s,i)=>{
    s.visible=i<2&&t<K('felicidades')+3;if(!s.visible)return;
    const hop=eio(seg(t,T_SIT-0.2,T_SIT+0.5));
    const home=i?V(0.6,3.0,1.6):V(-0.6,2.95,1.0);const off=V(i?3.6:-3.6,0,3.2+i);
    const p=home.clone().lerp(off,hop);p.y+=Math.sin(Math.PI*hop)*2.5;
    // lie back on hero once he is yanked down
    const back=eio(seg(t,K('felicidades')-0.3,K('felicidades')+0.6));
    s.position.copy(p);s.rotation.set(0,i*1.2,0);s.scale.setScalar(0.6);
    s.userData.body.rotation.z=0;s.userData.legs.forEach(l=>l.rotation.x=hop>0&&hop<1?0.9*Math.sin(t*18):-1.2*(1-hop));
    s.userData.head.scale.setScalar(1);
  });
}
function applyEffects(t){}

// ---------- camera
const P=(a,b,k)=>a.map((v,i)=>lerp(v,b[i],k));
const add=(v,x,y,z)=>[v.x+x,v.y+y,v.z+z];
const hpa=(x,y,z)=>add(HP,x,y,z);
const CUTS=[0,0.9,K('hasta')-0.1,K('antes')-0.15,T_HOOKEND,K('primero'),K('sí',0)-0.05,K('ahora',0),K('despacio')-0.15,K('no')-0.1,T_SIT,K('sí',1),K('ahora',1),K('ah')-0.1,T_FELI-0.1,K('regrese')-0.1,K('son')];
const shots=[
 (u,t)=>({p:hpa(0,lerp(6.4,5.2,u),1.6),l:hpa(0,-0.8,0),f:44}),                                  // 0 hook face top-down w/ beard
 (u,t)=>({p:P([0,6.5,14],[0,6,12.5],u),l:[0,2.2,-1],f:56}),                                      // 1 wide bed, sky flicker
 (u,t)=>({p:P([4,2.4,7.5],[2.5,3.2,6.5],u),l:hpa(0,0.5,0),f:46}),                               // 2 beard stands up
 (u,t)=>({p:P([-5,4.5,11],[-3,5,10.5],u),l:[0,3.2,-1],f:54}),                                   // 3 beard wide
 (u,t)=>({p:P([0,4.5,15],[0,4.2,13.5],eout(u)),l:[0,2.4,-1],f:52}),                              // 4 title wide
 (u,t)=>({p:hpa(0,lerp(5.0,3.8,u),1.4),l:hpa(0,0,0),f:40}),                                      // 5 face eyes closed -> open
 (u,t)=>({p:hpa(0.4,lerp(3.6,2.8,u),1.1),l:hpa(0,0,0),f:34}),                                    // 6 eye pop
 (u,t)=>({p:P([10,3.5,5],[8.5,3,5],u),l:[0,2.0,1.6],f:50}),                                      // 7 leg stretches (side)
 (u,t)=>({p:P([0.5,1.4,9.5],[0,1.9,8],u),l:[0,2.4,1.2],f:48}),                                   // 8 hands grab
 (u,t)=>({p:hpa(0,lerp(4.4,3.4,u),1.6),l:hpa(0,0,0),f:40}),                                      // 9 "techo" stare
 (u,t)=>({p:P([0,3.6,14.5],[0,3.8,13],u),l:[0,3.0,-1],f:56}),                                    // 10 sit wide
 (u,t)=>({p:P(hpa(0,0.6,7.2),hpa(0,0.3,4.6),eio(u)),l:hpa(0,0,0),f:42}),                         // 11 deadpan sitting
 (u,t)=>({p:P([0,0.7,11],[0,1.0,9],u),l:[0,4.2,-1.5],f:58}),                                     // 12 low stand attempt
 (u,t)=>({p:[0,3.8,14],l:[0,3.0,-1],f:60}),                                                       // 13 yank
 (u,t)=>({p:P([-3,4.5,8],[3,5.2,9],u),l:[0,3.8,-0.6],f:52}),                                     // 14 beard victory
 (u,t)=>({p:P([ns.position.x-0.5,3.3,1.4],[ns.position.x-0.2,3.1,0.6],u),l:[ns.position.x,2.4,-2.8],f:40}), // 15 clock 03:00
 (u,t)=>({p:hpa(0,lerp(6.4,5.2,u),1.6),l:hpa(0,-0.8,0),f:44}),                                  // 16 loop (== hook)
];
function applyCam(t){
  let si=0;for(let i=0;i<CUTS.length;i++)if(t>=CUTS[i])si=i;
  const a=CUTS[si],b=CUTS[si+1]||END+1.5;
  const u=clamp((t-a)/(b-a));const r=shots[si](u,t);
  let fov=r.f;
  for(const ts of swT){const d=TN-ts;if(d>0&&d<0.5)fov-=9*Math.exp(-d*10)}
  const dc=t-a;if(dc<0.12&&si>0)fov-=4*(1-dc/0.12);
  let sh=0;[[T_EYE2,0.8],[T_YANK,1.4],[T_YANK+0.35,1.2],[T_FELI,0.6]].forEach(([ts,amp])=>{const d=t-ts;if(d>0&&d<0.6)sh+=amp*Math.exp(-d*7)});
  cam.position.set(r.p[0]+sh*0.12*Math.sin(t*95),r.p[1]+sh*0.12*Math.cos(t*81),r.p[2]);
  cam.up.set(0,1,0);cam.lookAt(r.l[0],r.l[1],r.l[2]);
  cam.fov=fov;cam.updateProjectionMatrix();
}
// ---------- overlays + subtitles
const phrases=[];{let cur=[];words.forEach(w=>{cur.push(w);if(/[.?!,]|\.\.\.$/.test(w[0])||cur.length>=3){phrases.push(cur);cur=[]}});if(cur.length)phrases.push(cur)}
const $=id=>document.getElementById(id);
const subEl=$('sub'),endEl=$('end'),flash=$('flash'),speed=$('speed'),hook=$('hook'),title=$('title'),cnt=$('cnt'),pill=$('pill');
function pop(d,amp=0.45,k=16){return d<0?1:1+amp*Math.exp(-d*k)}
function applyUI(t){
  let idx=-1;for(let i=0;i<phrases.length;i++){const p=phrases[i],n=phrases[i+1];const st=p[0][1]-0.04,en=n?n[0][1]-0.04:p[p.length-1][2]+0.3;if(t>=st&&t<en){idx=i;break}}
  if(idx<0||t>END+0.1)subEl.innerHTML='';
  else subEl.innerHTML=phrases[idx].map(w=>{const sw=isSW(w[0]);const d=t-w[1];const act=d>=0&&t<w[2]+0.1;const sc=d<0?0.001:(pop(d,sw?0.5:0.4)*(sw?1.08:1));const rot=sw&&d>=0&&d<0.4?-4*Math.exp(-d*8):0;
    return `<span class="${sw?'sw':''}" style="transform:scale(${sc}) rotate(${rot}deg);color:${act&&!sw?'#ffe600':''}">${w[0].replace(/\.\.\.|[.,¿?]/g,'')}</span>`}).join('');
  const hk=t>=0&&t<T_HOOKEND;hook.style.display=hk?'block':'none';if(hk)hook.style.transform=`scale(${pop(t,0.3,14)}) rotate(${-2+Math.sin(t*30)*0.6}deg)`;
  const T3=K('cómo');const ts=t>=T3&&t<T3+1.4;title.style.display=ts?'block':'none';if(ts){const d=t-T3;title.style.transform=`scale(${pop(d,1.4,11)}) rotate(${-4+Math.sin(t*25)*(d<0.3?2:0.4)}deg)`}
  cnt.style.display='none';
  let f=0;[[T_EYE2,0.8],[T_YANK,1],[T_FELI,0.6],[T_HOOKEND,0.5]].forEach(([s,a])=>{const d=t-s;if(d>=0&&d<0.18)f=Math.max(f,a*(1-d/0.18))});
  swT.forEach(s=>{const d=t-s;if(d>=0&&d<0.1)f=Math.max(f,0.35*(1-d/0.1))});flash.style.opacity=f;
  let sp=0;swT.forEach(s=>{const d=t-s;if(d>=0&&d<0.45)sp=Math.max(sp,0.8*(1-d/0.45))});speed.style.opacity=sp;
  pill.style.display=(t>=K('cómo')+1.5&&t<K('abra')+0.5)?'block':'none';
  endEl.style.display=t>=END+0.1?'block':'none';$('logo').style.display=t<END+0.1?'block':'none';
}
window.renderFrame=(tn)=>{TN=tn;const t=tn;applyHero(t);applyProps(t);applyEffects(t);applyCam(t);renderer.render(scene,cam);applyUI(tn);return true};
window.ready=true;
</script></body></html>
