const T_CTRL=K('control'),T_MANOS=K('manos'),T_PATAS=K('patas'),T_BTN=K('botón'),T_UNO=K('uno'),T_VEINTE=K('veinte');
const T_AIM=K('apunte'),T_SHOOT=K('dispare'),T_FF=K('disparó'),T_DIE=K('murió'),T_BOTS=K('bots'),T_FELI=K('felicidades'),T_KID=K('niño'),T_OFF=K('apague'),T_THROW=K('eso');
const SW=new Set(['mierda','pendejo','chingada','mono','baboso','imbécil','puto','manco','verga','culero','hijo']);
const isSW=w=>SW.has(norm(w));
const swT=words.filter(w=>isSW(w[0])).map(w=>w[1]);
const blinks=[1.5,6.0,10.0,15.0,21.0];
const wordAt=t=>words.find(w=>t>=w[1]&&t<w[2]+0.02);
let TN=0;
const DIRF=V(Math.sin(0.8),0,Math.cos(0.8));
const fcam=(d,hy,side=0)=>[HP.x+DIRF.x*d+DIRF.z*side,HP.y+hy,HP.z+DIRF.z*d-DIRF.x*side];
const rage=t=>clamp(0.15+0.85*seg(t,0,T_OFF+0.3))*(1-seg(t,K('culero')+0.1,K('culero')+0.2)*0);
function drawGame(t){
  const c=gameTex.userData.c,g=c.getContext('2d'),W=256,H=160;
  g.fillStyle='#0d1b2a';g.fillRect(0,0,W,H);
  g.fillStyle='#1b3a4b';g.fillRect(0,110,W,50);
  const blink=Math.floor(t*4)%2===0;
  const phase=t<K('cómo')?0:t<T_BTN?1:t<T_AIM?2:t<T_DIE?3:t<T_BOTS?4:t<T_BOTS+1.6?5:t<T_FELI?6:t<T_OFF+0.35?7:8;
  g.textAlign='center';
  if(phase===0){g.fillStyle='#e63946';g.font='900 34px sans-serif';g.fillText(blink?'GAME OVER':'',W/2,62);g.fillStyle='#fff';g.font='900 18px sans-serif';g.fillText('K/D  0 / 47',W/2,96);g.fillText('TUTORIAL: PERDISTE',W/2,126)}
  else if(phase===1){g.fillStyle='#ffd54a';g.font='900 20px sans-serif';g.fillText('TUTORIAL',W/2,30);g.fillStyle='#e63946';g.fillRect(100+12*Math.sin(t*5),86,22,24);g.fillStyle='#fff';g.font='900 12px sans-serif';g.fillText(Math.floor(t*30)%2?'A':'B',111+12*Math.sin(t*5),102);g.fillStyle='#fff';g.fillText('PRESIONA A PARA SALTAR',W/2,140)}
  else if(phase===2){const n=Math.floor((t-T_BTN)*14);g.fillStyle='#fff';g.font='900 20px sans-serif';g.fillText('A B X Y A B X Y',W/2,40);for(let i=0;i<20;i++){g.fillStyle=['#ff2d2d','#39ff14','#2d7bff','#ffd700'][(i+n)%4];g.beginPath();g.arc(20+(i%10)*24,70+Math.floor(i/10)*36,9,0,7);g.fill()}g.fillStyle='#e63946';g.font='900 16px sans-serif';g.fillText('ERROR: DEMASIADOS BOTONES',W/2,148)}
  else if(phase===3){const hit=t>=T_FF;[[60,100],[100,96],[150,102]].forEach(([x,y],i)=>{g.fillStyle=hit&&(t-T_FF)>0.1*i?'#555':'#2d7bff';g.fillRect(x,y,18,22)});g.fillStyle='#e63946';g.fillRect(200,98,20,24);g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(128+20*Math.sin(t*3),60,16,0,7);g.moveTo(128+20*Math.sin(t*3)-24,60);g.lineTo(128+20*Math.sin(t*3)+24,60);g.stroke();if(hit){g.fillStyle='#e63946';g.font='900 22px sans-serif';g.fillText('TEAM KILL  -100',W/2,36)}}
  else if(phase===4){g.fillStyle='#e63946';g.fillRect(0,50,W,50);g.fillStyle='#fff';g.font='900 38px sans-serif';g.fillText('YOU DIED',W/2,88)}
  else if(phase===5){g.fillStyle='#fff';g.font='900 18px sans-serif';g.fillText('3 BOTS ESCRIBIERON:',W/2,40);g.fillStyle='#39ff14';g.font='900 36px sans-serif';g.fillText('JAJAJAJA',W/2,90);g.fillStyle='#ff2d95';g.fillText('L + RATIO',W/2,134)}
  else if(phase===6){g.fillStyle='#ffd54a';g.font='900 18px sans-serif';g.fillText('MARCADOR',W/2,24);g.fillStyle='#fff';g.font='900 22px sans-serif';g.fillText('NIÑO_9AÑOS   99',W/2,70);g.fillStyle='#e63946';g.fillText('TÚ   0',W/2,112);g.fillStyle='#999';g.font='900 14px sans-serif';g.fillText('(PERDISTE POR WALKOVER)',W/2,146)}
  else if(phase===7){g.fillStyle='#fff';g.font='900 20px sans-serif';g.fillText(blink?'RAGE QUIT?':'',W/2,80)}
  else{ // static
    const im=g.getImageData(0,0,W,H);for(let i=0;i<W*H;i++){const v=(Math.sin(i*12.9898+t*80)*43758.5453%1+1)%1*255;im.data[i*4]=v;im.data[i*4+1]=v;im.data[i*4+2]=v;im.data[i*4+3]=255}g.putImageData(im,0,0)}
  gameTex.needsUpdate=true;
}
function applyHero(t){
  const handsPhase=t>=T_MANOS+0.15;
  const a=handsPhase?Math.PI/2:1.45;
  hero.position.set(-1.5,-0.9,1.6);hero.rotation.set(0,0.8,0);hero.scale.set(1,1,1);
  legs.forEach((l,i)=>{l.th.rotation.x=-a;l.kn.rotation.x=handsPhase?a:-0.5;l.th.scale.set(1,1,1);l.kn.scale.set(1,1,1)});
  const throwK=seg(t,T_THROW-0.15,T_THROW+0.3);
  ctrlFeet.visible=!handsPhase;ctrlHands.visible=handsPhase&&t<T_THROW;
  torsoP.rotation.x=handsPhase?0.15+0.04*Math.sin(t*30)*(t>=T_VEINTE-0.2&&t<T_VEINTE+1.2?3:0):-0.22;
  const spaz=t>=T_VEINTE-0.2&&t<T_VEINTE+1.5?1:0;
  arms.forEach((g,i)=>{const s=i?1:-1;g.position.x=s*0.95;g.scale.set(1,1,1);g.rotation.z=s*(0.15+(throwK>0?0.3:0));
    let rx=handsPhase?-1.0+(spaz?0.35*Math.sin(t*34+i*2):0)+(t>=T_AIM&&t<T_AIM+1.9?-0.15:0):-0.35;
    if(throwK>0){rx=lerp(-1.0,-2.6,eio(clamp(throwK*2)))+(throwK>0.5?1.8*eio((throwK-0.5)*2):0)}
    g.rotation.x=rx});
  headP.position.y=1.7;headP.rotation.set(-0.05+0.06*Math.sin(t*3),0,0.05*Math.sin(t*1.4)+(spaz?0.12*Math.sin(t*30):0));
  const rg=rage(t);skinM.color.copy(SKINC).lerp(new THREE.Color(0xe0453a),rg*0.65);
  let blink=0;for(const b of blinks){const d=t-b;if(d>0&&d<0.14)blink=Math.sin(d/0.14*Math.PI)}
  eyeRig.forEach(r=>{r.lid.rotation.x=0.05+1.2*blink;r.e.scale.setScalar(1+0.5*rg);r.pup.visible=true;r.spiral.visible=false;
    const toTV=0.9*(t>=T_AIM||t<T_KID?1:0);r.pup.position.set(toTV*0.1,0,0.25);
    r.brow.rotation.z=r.s*(-0.35-0.3*rg);r.brow.position.y=0.62;r.bag.scale.set(1.1,0.45,0.45)});
  const w=wordAt(TN);let open=0;if(w)open=0.3+0.7*Math.abs(Math.sin((TN-w[1])*21));
  const shout=SW.has(norm((w||[''])[0]))?1:0;
  mouth.scale.set(0.3+0.12*rg+0.12*shout,0.03+0.2*open+0.1*rg+0.15*shout,0.14);drool.visible=false;
  hero.updateMatrixWorld(true);head.getWorldPosition(HP);hero.getWorldPosition(HEROPOS);
}
function applyProps(t){
  drawGame(t);
  const hue=(t*0.4)%1;strips.forEach((m,i)=>m.color.setHSL((hue+i*0.3)%1,1,0.55));pcGlow.material.color.setHSL((hue+0.5)%1,1,0.5);
  tvLight.intensity=t>=T_OFF+0.45?0:35+10*Math.sin(t*9);
  // bots laugh
  BOTS.forEach((b,i)=>{const on=t>=T_BOTS-0.1+0.12*i;b.visible=on;jb[i].visible=on;if(!on)return;const k=eback(seg(t,T_BOTS-0.1+0.12*i,T_BOTS+0.25+0.12*i));b.scale.setScalar(Math.max(0.01,k));b.position.y=Math.abs(Math.sin(t*14+i))*0.25*k;b.userData.hd.rotation.z=0.3*Math.sin(t*18+i);
    jb[i].position.set(b.position.x+0.4,b.position.y+3.4+0.1*Math.sin(t*5+i),b.position.z+0.6);jb[i].quaternion.copy(cam.quaternion);jb[i].scale.setScalar(Math.max(0.001,k)*(0.7+0.1*Math.sin(t*20+i)))});
  // kid appears and dabs
  const kk=eback(seg(t,T_KID-0.1,T_KID+0.3));kid.visible=t>=T_KID-0.1&&t<T_OFF+1.2;kid.scale.setScalar(Math.max(0.01,kk));
  const dab=t>=K('años');kid.userData.al.rotation.set(0,0,dab?2.5:0.2);kid.userData.ar.rotation.set(0,0,dab?1.5:-0.2);kid.rotation.z=dab?0.2:0;kid.userData.mouth.scale.set(1+(dab?1:0),1+(dab?2:0),1);
  kid.position.y=Math.abs(Math.sin(t*10))*0.15*(kid.visible&&!dab?1:0);
  // controller throw
  const tk=seg(t,T_THROW,T_THROW+0.45);ctrlFly.visible=tk>0&&tk<1;
  if(ctrlFly.visible){const p0=V(HP.x,HP.y-0.8,HP.z+0.4),p1=V(4.0,3.2,0.9);const p=p0.clone().lerp(p1,eio(tk));p.y+=Math.sin(Math.PI*tk)*1.8;ctrlFly.position.copy(p);ctrlFly.rotation.set(tk*14,tk*10,tk*6)}
  // TV smash
  const sm=t-(T_THROW+0.45);
  tvG.rotation.z=sm>0?-0.55*eio(clamp(sm/0.5)):0;tvG.position.set(5.3+(sm>0?0.8*eio(clamp(sm/0.5)):0),sm>0?-0.8*eio(clamp(sm/0.5)):0,0.4);
  sparks.forEach((m,i)=>{const d=sm;if(d<0||d>1.2){m.visible=false;return}m.visible=true;const a=rnd(i)*6.28,v=3+rnd(i+9)*6;m.position.set(4.0+Math.cos(a)*v*d*0.5,3.2+Math.sin(a)*v*d*0.6-6*d*d+1.2,0.9+(rnd(i+3)-.5)*v*d*0.6);m.scale.setScalar(1-d/1.2)});
  smoke.forEach((m,i)=>{const d=sm-0.15*(i%6);if(d<0||d>3){m.visible=false;return}m.visible=true;m.position.set(4.2+0.3*Math.sin(i+d*2),3.0+d*1.6,0.9+0.3*Math.cos(i));m.scale.setScalar(0.5+d*0.8);m.material.opacity=0.55*(1-d/3)});
}
function applyEffects(t){}

// ---------- camera
const P=(a,b,k)=>a.map((v,i)=>lerp(v,b[i],k));
const TVC=[4.3,3.3,0.7];
const CUTS=[0,K('jugando'),K('hasta'),K('mató')-0.15,T_HOOKEND,K('primero'),T_CTRL,T_MANOS-0.1,T_PATAS-0.15,K('ahora',0),T_UNO,K('no',1)-0.1,T_AIM,T_SHOOT,T_FF-0.1,K('imbécil')-0.2,T_DIE,K('puto')-0.1,T_BOTS-0.2,T_FELI,T_KID-0.3,T_OFF-0.1,K('verga')-0.4];
const shots=[
 (u,t)=>({p:P([1.2,3.0,5.2],[2.4,3.2,4.4],u),l:TVC,f:62}),                                       // 0 hook TV GAME OVER
 (u,t)=>({p:fcam(lerp(5.4,4.3,u),0.1),l:HP.toArray(),f:38}),                                      // 1 hero rage face
 (u,t)=>({p:P([0,3.6,14],[1.5,3.4,12.5],u),l:[1.5,2.4,0.8],f:58}),                              // 2 wide
 (u,t)=>({p:P([2.6,3.0,6.5],[3.2,3.2,5.6],u),l:TVC,f:62}),                                       // 3 TV tutorial
 (u,t)=>({p:P([0,3.8,15],[0.5,3.6,13.5],eout(u)),l:[1.2,2.4,1.0],f:52}),                         // 4 title
 (u,t)=>({p:P([0.8,1.5,6.8],[0,1.3,5.6],u),l:[-0.8,1.4,2.8],f:46}),                              // 5 feet play
 (u,t)=>({p:fcam(lerp(5.2,4.4,u),0.1),l:HP.toArray(),f:38}),                                      // 6 face
 (u,t)=>({p:fcam(7.0,0.3,3.0),l:[HP.x,2.3,HP.z],f:48}),                                          // 7 hands switch
 (u,t)=>({p:P([0.6,1.2,6.2],[-0.2,1.1,5.0],u),l:[-1.2,1.0,2.8],f:46}),                           // 8 patas close
 (u,t)=>({p:P([2.8,3.2,6.6],[3.4,3.3,5.8],u),l:TVC,f:62}),                                       // 9 TV buttons
 (u,t)=>({p:fcam(lerp(5.6,4.6,u),-0.6),l:[HP.x,HP.y-1.2,HP.z],f:42}),                            // 10 one button
 (u,t)=>({p:P([0.5,3.6,10.5],[1.0,3.5,9.5],u),l:[0,2.6,1.4],f:52}),                              // 11 spaz wide
 (u,t)=>({p:fcam(lerp(5.0,4.0,u),0.1),l:HP.toArray(),f:36}),                                      // 12 aim
 (u,t)=>({p:P([2.4,3.3,6.4],[3.0,3.4,5.6],u),l:TVC,f:62}),                                       // 13 shoot TV
 (u,t)=>({p:P([3.2,3.3,5.4],[3.6,3.4,4.8],u),l:TVC,f:62}),                                       // 14 friendly fire
 (u,t)=>({p:fcam(lerp(4.4,3.4,u),0.1),l:HP.toArray(),f:34}),                                      // 15 rage imbécil
 (u,t)=>({p:P([2.8,3.3,6.0],[3.6,3.4,5.0],u),l:TVC,f:62}),                                       // 16 YOU DIED
 (u,t)=>({p:fcam(lerp(4.8,4.0,u),0.0),l:HP.toArray(),f:38}),                                      // 17 humiliated face
 (u,t)=>({p:P([-2.5,3.4,10],[-3.5,3.2,9],u),l:[-6.0,2.4,-0.6],f:52}),                            // 18 bots laugh
 (u,t)=>({p:P([2.8,3.3,6.4],[3.6,3.4,5.4],u),l:TVC,f:62}),                                       // 19 scoreboard
 (u,t)=>({p:P([0.5,2.6,10],[0.8,2.4,8.5],u),l:[0.8,1.8,3.6],f:48}),                              // 20 kid dab
 (u,t)=>({p:P([1.0,3.4,13],[2.0,3.4,11.5],u),l:[1.5,2.8,0.9],f:56}),                             // 21 throw + smash
 (u,t)=>({p:fcam(lerp(5.2,3.9,u),0.1),l:HP.toArray(),f:36}),                                      // 22 final rage face
];
function applyCam(t){
  let si=0;for(let i=0;i<CUTS.length;i++)if(t>=CUTS[i])si=i;
  const a=CUTS[si],b=CUTS[si+1]||END+1.5;
  const u=clamp((t-a)/(b-a));const r=shots[si](u,t);
  let fov=r.f;
  for(const ts of swT){const d=TN-ts;if(d>0&&d<0.5)fov-=9*Math.exp(-d*10)}
  const dc=t-a;if(dc<0.12&&si>0)fov-=4*(1-dc/0.12);
  let sh=0;[[T_FF,0.8],[T_DIE,0.9],[T_THROW+0.45,1.8],[T_KID+0.3,0.5]].forEach(([ts,amp])=>{const d=t-ts;if(d>0&&d<0.6)sh+=amp*Math.exp(-d*7)});
  if(t>=T_VEINTE-0.2&&t<T_VEINTE+1.4)sh+=0.5;
  cam.position.set(r.p[0]+sh*0.12*Math.sin(t*95),r.p[1]+sh*0.12*Math.cos(t*81),r.p[2]);
  cam.up.set(0,1,0);cam.lookAt(r.l[0],r.l[1],r.l[2]);
  cam.rotation.z+=(si===2||si===11||si===21)?0.05*Math.sin(t*4):0;
  cam.fov=fov;cam.updateProjectionMatrix();
}
// ---------- overlays + subtitles
const phrases=[];{let cur=[];words.forEach(w=>{cur.push(w);if(/[.?!,]|\.\.\.$/.test(w[0])||cur.length>=3){phrases.push(cur);cur=[]}});if(cur.length)phrases.push(cur)}
const $=id=>document.getElementById(id);
const subEl=$('sub'),endEl=$('end'),flash=$('flash'),speed=$('speed'),hook=$('hook'),title=$('title'),cnt=$('cnt'),pill=$('pill');
function pop(d,amp=0.45,k=16){return d<0?1:1+amp*Math.exp(-d*k)}
const crackEl=document.getElementById('crack');
function applyUI(t){
  let idx=-1;for(let i=0;i<phrases.length;i++){const p=phrases[i],n=phrases[i+1];const st=p[0][1]-0.04,en=n?n[0][1]-0.04:p[p.length-1][2]+0.3;if(t>=st&&t<en){idx=i;break}}
  if(idx<0||t>END+0.1)subEl.innerHTML='';
  else subEl.innerHTML=phrases[idx].map(w=>{const sw=isSW(w[0]);const d=t-w[1];const act=d>=0&&t<w[2]+0.1;const sc=d<0?0.001:(pop(d,sw?0.5:0.4)*(sw?1.08:1));const rot=sw&&d>=0&&d<0.4?-4*Math.exp(-d*8):0;
    return `<span class="${sw?'sw':''}" style="transform:scale(${sc}) rotate(${rot}deg);color:${act&&!sw?'#ffe600':''}">${w[0].replace(/\.\.\.|[.,¿?]/g,'')}</span>`}).join('');
  const hk=t>=0&&t<T_HOOKEND;hook.style.display=hk?'block':'none';if(hk)hook.style.transform=`scale(${pop(t,0.3,14)}) rotate(${-2+Math.sin(t*30)*0.6}deg)`;
  const T3=K('cómo');const ts=t>=T3&&t<T3+1.4;title.style.display=ts?'block':'none';if(ts){const d=t-T3;title.style.transform=`scale(${pop(d,1.4,11)}) rotate(${-4+Math.sin(t*25)*(d<0.3?2:0.4)}deg)`}
  cnt.style.display='none';
  let f=0;[[T_THROW+0.45,1],[T_FF,0.5],[T_DIE,0.6],[T_HOOKEND,0.5]].forEach(([s,a])=>{const d=t-s;if(d>=0&&d<0.18)f=Math.max(f,a*(1-d/0.18))});
  swT.forEach(s=>{const d=t-s;if(d>=0&&d<0.1)f=Math.max(f,0.35*(1-d/0.1))});flash.style.opacity=f;
  let sp=0;swT.forEach(s=>{const d=t-s;if(d>=0&&d<0.45)sp=Math.max(sp,0.8*(1-d/0.45))});speed.style.opacity=sp;
  pill.style.display=(t>=K('cómo')+1.5&&t<K('primero')+0.8)?'block':'none';
  if(crackEl){const cd=t-(T_THROW+0.45);crackEl.style.opacity=cd>=0?1:0}
  endEl.style.display=t>=END+0.1?'block':'none';$('logo').style.display=t<END+0.1?'block':'none';
}
window.renderFrame=(tn)=>{TN=tn;const t=tn;applyHero(t);applyProps(t);applyEffects(t);applyCam(t);renderer.render(scene,cam);applyUI(tn);return true};
window.ready=true;
</script></body></html>
