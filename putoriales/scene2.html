};

  headP.position.y=topY+0.25;
  arms.forEach((g,i)=>{const s=i?1:-1;g.position.set(s*(0.85*sx*0.85+0.2),0.68+0.4*0.78*sy,0)});
  tie.position.set(0,0.1,0.93);
  const stress=clamp(I/2.6)*(0.4+0.6*seg(t,K('sostenga'),T_BLAST));
  // colors
  const c=SKINC.clone().lerp(PURPLE,clamp(stress*0.9));
  if(t<POP)c.copy(SKINC).lerp(BLUE,0.55).lerp(PURPLE,0.35);
  skinM.color.copy(c);
  // body motion
  let hy=1.6*Math.max(0,I-1.0), hx=0,hz=0.5, rx=0,rz=0,ry=0;
  const hov=Math.max(0,I-1.0);
  hy+=0.12*Math.sin(t*2.4)*hov;hz=0.5;
  if(t>=T_BLAST+0.12){
    const k=seg(t,T_BLAST+0.12,LAND);FLY=k;
    const land=seg(t,LAND-0.35,LAND);
    const fx=4.2*Math.sin(k*11+0.5)*(1-0.35*k),fy=3.2+2.6*Math.sin(k*8.3)*(1-0.3*k)-2.0*k,fz=0.5+2.0*Math.cos(k*7);
    hx=lerp(fx,0,eio(land));hy=lerp(fy,0.75,eio(land));hz=lerp(fz,3.2,eio(land));
    rz=(k*30)*(1-eio(land));rx=-Math.PI/2*eio(land);
    // jitter hero to look like fart-jet
  }
  hero.position.set(hx,hy,hz);hero.rotation.set(rx,ry,rz);
  // legs
  const kick=hov*0.35+(t>=T_BLAST?0.5:0);
  legs.forEach((l,i)=>{l.th.rotation.x=-kick*Math.sin(t*7+i*2.2);l.kn.rotation.x=kick*0.6*Math.max(0,Math.sin(t*7+i*2.2))});
  // arms
  const point=eio(seg(t,K('pendejo')-0.15,K('pendejo')+0.1))*(1-eio(seg(t,K('respirar',1)+0.4,K('respirar',1)+0.7)));
  const shrug=eio(seg(t,K('alguien'),K('alguien')+0.2))*(1-eio(seg(t,K('decirlo')+0.5,K('decirlo')+0.8)));
  const bal=clamp(I/2.6);
  arms.forEach((g,i)=>{const s=i?1:-1;
    g.rotation.z=s*(0.12+0.55*bal+shrug*0.9+(t<POP?0.5*Math.sin(t*13+i):0)+(t>=T_BLAST?0.9*Math.sin(t*25+i):0));
    g.rotation.x=(i?-1.55*point:0)-0.1*Math.sin(t*2)+(t>=T_BLAST?0.6*Math.sin(t*19):0)});
  torsoP.rotation.z=0.03*Math.sin(t*1.3)+shrug*0.08;
  headP.rotation.z=0.05*Math.sin(t*1.7)+shrug*0.25;
  headP.rotation.x=0.04*Math.sin(t*1.5);
  // eyes / face
  let lx=0,ly=0;
  if(t>=K('chingue')&&t<K('chingue')+0.5){lx=0.9;ly=0.4}
  let blink=0;for(const b of blinks){const d=t-b;if(d>0&&d<0.14)blink=Math.sin(d/0.14*Math.PI)}
  const bulge=1+0.55*stress+(t<POP?0.5:0)+(t>=T_BLAST&&t<T_BLAST+0.6?0.6:0);
  const raise=eio(seg(t,K('pendejo')-0.1,K('pendejo')+0.1))*(1-eio(seg(t,K('pendejo')+0.5,K('pendejo')+0.7)));
  eyeRig.forEach(r=>{
    r.e.scale.setScalar(bulge);
    r.lid.rotation.x=0.05+1.35*blink-0.7*clamp(stress+(t<POP?1:0))-0.4*raise*(r.s>0?1:0)+(t>LAND+1.4?0.9*seg(t,LAND+1.4,LAND+1.6)*(1-seg(t,LAND+1.7,LAND+1.9)):0);
    r.pup.position.set(lx*0.1,ly*0.1,0.24);r.pup.scale.setScalar(1-0.45*stress);
    r.brow.rotation.z=r.s*(0.14+0.5*stress*(1)) +(r.s>0?-0.25*raise:0);
    r.brow.position.y=0.66+(r.s>0?0.15*raise:0)+0.12*stress;
  });
  const flare=seg(t,K('abra'),K('nariz'))+ (t>=T_INH0&&t<T_INH1?1:0);
  nostrils.forEach(n=>n.scale.setScalar(1+1.4*clamp(flare)+(t<POP?1.5:0)));
  const puff=clamp(stress*1.2+(t<POP?1:0));
  cheeks.forEach(c=>c.scale.setScalar(0.01+1.4*puff));
  // mouth
  const w=wordAt(TN);let open=0;if(w)open=0.3+0.7*Math.abs(Math.sin((TN-w[1])*21));
  const o2=t>=T_BLAST&&t<T_BLAST+0.8?2.2:0;
  mouth.scale.set(0.34+0.1*o2+(t>=T_BLAST+0.8&&t<LAND?0.25:0),0.03+0.2*open+0.25*o2+(t>=T_BLAST+0.8&&t<LAND?0.35:0)*(1-FLY*0.5),0.14);
  if(puff>0.5&&t<T_BLAST)mouth.scale.set(0.12,0.04,0.1);
  // finger in nose
  const fin=eio(seg(t,T_FINGER-0.4,T_FINGER))*(1-eio(seg(t,T_COCHINO+0.35,T_COCHINO+0.6)));
  finger.position.set(0.1,lerp(-2,-0.1,fin),1.0);finger.rotation.z=0.1*Math.sin(t*28)*fin;
  // headband float
  headband.rotation.y=t*0.3;
  hero.updateMatrixWorld(true);head.getWorldPosition(HP);hero.getWorldPosition(HEROPOS);
}
function wordAt(t){return words.find(w=>t>=w[1]&&t<w[2]+0.02)}
let TN=0;

// ---------- items
const NOSE=new THREE.Vector3(),MOUTH=new THREE.Vector3();
const G=30;
function applyItems(t){
  head.updateWorldMatrix(true,false);
  NOSE.set(0,-0.15,1.05);head.localToWorld(NOSE);MOUTH.set(0,-0.46,0.9);head.localToWorld(MOUTH);
  ITEMS.forEach((it,i)=>{
    const g=it.g;const [hx,hz]=it.home;const DUR=0.8;
    g.visible=true;g.scale.setScalar(1);g.rotation.set(0,0,0);
    if(t<(T_INH0+S_OFF[i])-0.45||t>=T_INH1+99){g.position.set(hx,0,hz)}
    if(t<(T_INH0+S_OFF[i])){ // pre-suction wobble
      const w=seg(t,(T_INH0+S_OFF[i])-0.45,(T_INH0+S_OFF[i]));g.position.set(hx+0.08*Math.sin(t*50)*w,0.15*w*Math.abs(Math.sin(t*20)),hz);
      if(t<=(T_INH0+S_OFF[i])-0.45)g.position.set(hx,0,hz);
    }else if(t<(T_INH0+S_OFF[i])+DUR){
      const k=eio(seg(t,(T_INH0+S_OFF[i]),(T_INH0+S_OFF[i])+DUR));const p0=V(hx,0,hz);const mid=V((hx+NOSE.x)/2,5.5+i*0.3,(hz+NOSE.z)/2);
      const a=p0.clone().lerp(mid,k),b=mid.clone().lerp(NOSE,k);g.position.copy(a.lerp(b,k));
      g.scale.setScalar(Math.max(0.03,1-k*0.97));g.rotation.set(k*9,k*12,k*7);
    }else if(t<T_BLAST+i*0.05){g.visible=false}
    else{
      const d=t-(T_BLAST+i*0.05);
      const isChair=i===5;
      const T=isChair?0.36:1.15+i*0.1;
      const x0=MOUTH.x,y0=MOUTH.y,z0=MOUTH.z;
      let tx,tz,ty;
      if(isChair){tx=0;tz=9.2;ty=3.4}else{[tx,tz]=it.land;ty=0}
      const vx=(tx-x0)/T,vz=(tz-z0)/T,vy=(ty-y0+0.5*G*T*T)/T;
      const dd=Math.min(d,T);
      g.position.set(x0+vx*dd,y0+vy*dd-0.5*G*dd*dd,z0+vz*dd);
      g.scale.setScalar(isChair?lerp(0.3,2.6,dd/T):Math.min(1,0.1+dd*8));
      g.rotation.set(d<T?d*9:0,d<T?d*11:0,d<T?d*6:0);
      if(isChair&&d>=T)g.visible=false;
    }
  });
  // streaks
  const act=t>=T_INH0&&t<T_INH1;
  streaks.forEach((m,j)=>{
    if(!act){m.visible=false;return}
    const ph=((t*1.6+rnd(j)*3)%1);const ang=rnd(j+7)*6.283,el=(rnd(j+21)-0.4)*1.5,r=(2.4+rnd(j+3)*5)*(1-ph);
    const dir=V(Math.cos(ang)*Math.cos(el),Math.sin(el),Math.abs(Math.sin(ang))*Math.cos(el)+0.3).normalize();
    m.position.copy(NOSE).addScaledVector(dir,r);m.lookAt(NOSE);m.scale.z=0.4+r*0.5;m.visible=r>0.4;
  });
  // pop confetti
  confetti.forEach((m,i)=>{const d=t-POP;if(d<0||d>2.2){m.visible=false;return}
    m.visible=true;const vx=(rnd(i)-.5)*12,vy=3+rnd(i+50)*10,vz=(rnd(i+90)-.4)*8;
    m.position.set(vx*d,POPY+vy*d-9*d*d,1.0+vz*d);m.rotation.set(d*rnd(i+3)*14,d*rnd(i+4)*14,d*rnd(i+5)*9)});
}
let POPY=6.4;

// ---------- room reactions
function applyRoom(t){
  const g=eio(seg(t,K('cochino')-0.05,K('cochino')+0.2))*(1-eio(seg(t,K('ahora',0)-0.3,K('ahora',0))));
  sunBody.material.color.set(g>0.3?0xb6e04a:0xfff176);
  sunMouth.scale.set(1+g*1.2,1+g*3,1);sunMouth.position.y=-0.3-g*0.05;
  sunG.rotation.z=0.12*Math.sin(t*1.5)+g*0.3;sunG.scale.setScalar(1+0.3*g);
  hang.forEach((h,i)=>{h.rotation.z=0.05*Math.sin(t*1.3+i)});
  neon.material.opacity=0.85+0.15*Math.sin(t*9);
  // lying on mat: mat stays
  yoga.visible=true;
}

// ---------- camera
const P=(a,b,k)=>a.map((v,i)=>lerp(v,b[i],k));
const add=(v,x,y,z)=>[v.x+x,v.y+y,v.z+z];
const CUTS=[0,K('pues'),K('verga',0)-0.15,HOOKEND,K('sí'),K('alguien'),K('primero'),K('ese'),T_COCHINO+0.2,K('ahora',0),K('no'),K('sostenga'),T_UNO,T_DOS,T_PINCHE,K('ahora',1),T_BLAST,LAND-1.15,LAND,LAND+1.1];
const hpa=(x,y,z)=>add(HP,x,y,z);
const shots=[
 (u,t)=>({p:P([0,1.0,7],[0,HP.y-0.6,5.0],eio(u)),l:[0,HP.y+0.1,0.5],f:lerp(55,48,u)}),                 // 0 hook: balloon from below
 (u,t)=>({p:hpa(0,0,lerp(6.2,5.0,u)),l:hpa(0,0,0),f:40}),                                         // 1 bulging face
 (u,t)=>({p:P([-5,HP.y+1,11],[5,HP.y-1,10],u),l:[0,HP.y,0.5],f:58}),                              // 2 wide whip
 (u,t)=>({p:P([0,3.2,12.5],[0,3.4,11],eout(u)),l:[0,3.0,0],f:50}),                                // 3 title
 (u,t)=>({p:P([0.8,3.7,6.5],[0.2,3.9,5.6],u),l:[0,3.7,0],f:44}),                                  // 4 sí pendejo
 (u,t)=>({p:P([-6,1.6,8],[-3.5,2.4,8.6],u),l:[0,3.1,0.5],f:52}),                                  // 5 alguien tenía
 (u,t)=>({p:hpa(lerp(1.4,0.5,u),-0.1,lerp(5.0,4.3,u)),l:hpa(0,-0.1,0.9),f:36}),                  // 6 primero abra la nariz
 (u,t)=>({p:hpa(lerp(-0.3,0.3,u),-0.15,lerp(4.0,3.5,u)),l:hpa(0,-0.2,1.0),f:30}),                             // 7 hoyos / dedo
 (u,t)=>({p:[2.6+0.1*Math.sin(t*3),6.5,-0.5],l:[2.6,6.5,-5],f:38}),                               // 8 sun gag
 (u,t)=>({p:[0,3.6,14],l:[0,3.2,-0.5],f:54}),                                                      // 9 inhale wide
 (u,t)=>({p:P([0,3.6,14],[0,4.4,19],eio(u)),l:[0,3.6,-0.5],f:56}),                                // 10 pullback
 (u,t)=>({p:P([-3,2,13],[-1,3,12],u),l:[0,HP.y-1.2,0],f:58}),                                     // 11 sostenga
 (u,t)=>({p:hpa(0,0,lerp(5.8,5.0,u)),l:hpa(0,0,0),f:40}),                                         // 12 uno
 (u,t)=>({p:hpa(lerp(5.8,5.0,u),0.1,0.8),l:hpa(0,0,0.2),f:40}),                                   // 13 dos profile
 (u,t)=>({p:hpa(0.8,0.2,lerp(3.8,3.0,u)),l:hpa(0.2,0.1,0.7),f:36}),                             // 14 tres eye
 (u,t)=>({p:P(add(HP,0,0,8.0),add(HP,0,-0.3,3.8),eio(u)),l:hpa(0,-0.1,0),f:40}),                 // 15 suelte... silence push
 (u,t)=>({p:[0,3.8,9.6],l:[0,3.6,0],f:55}),                                                       // 16 blast
 (u,t)=>({p:[0,4.2,17],l:[HEROPOS.x*0.6,HEROPOS.y*0.7+1.5,0],f:62}),                              // 17 rocket
 (u,t)=>({p:P([0,7.2,1.6],[0,7.0,0.4],u),l:[0,0.7,-0.8],f:46}),                                   // 18 lying top
 (u,t)=>({p:P([8.0,2.0,0.6],[6.6,1.7,0.6],u),l:[0,1.0,0.3],f:46}),                                  // 19 foot end
];
function applyCam(t){
  let si=0;for(let i=0;i<CUTS.length;i++)if(t>=CUTS[i])si=i;
  const a=CUTS[si],b=CUTS[si+1]||END+1.5;
  const u=clamp((t-a)/(b-a));const r=shots[si](u,t);
  let fov=r.f;
  for(const ts of swT){const d=t-ts;if(d>0&&d<0.5)fov-=9*Math.exp(-d*10)}
  // sudden punch on cut
  const dc=t-a;if(dc<0.12&&si>0)fov-=4*(1-dc/0.12);
  let sh=0;[[POP,0.9],[T_BLAST,1.2],[T_BLAST+0.38,1.6],[LAND,0.7],[K('cobré')+0.2,0.0]].forEach(([ts,amp])=>{const d=t-ts;if(d>0&&d<0.6)sh+=amp*Math.exp(-d*7)});
  if(t>T_UNO&&t<T_BLAST)sh+=0.1+0.5*seg(t,T_UNO,T_BLAST);
  cam.position.set(r.p[0]+sh*0.12*Math.sin(t*95),r.p[1]+sh*0.12*Math.cos(t*81),r.p[2]);
  cam.lookAt(r.l[0],r.l[1],r.l[2]);
  cam.rotation.z+=((si===2||si===17)?0.07*Math.sin(t*4):0)+(si===14?0.04:0);
  cam.fov=fov;cam.updateProjectionMatrix();
}

// ---------- overlays + subtitles
const phrases=[];{let cur=[];words.forEach(w=>{cur.push(w);if(/[.?!,]|\.\.\.$/.test(w[0])||cur.length>=3){phrases.push(cur);cur=[]}});if(cur.length)phrases.push(cur)}
const $=id=>document.getElementById(id);
const subEl=$('sub'),endEl=$('end'),flash=$('flash'),speed=$('speed'),hook=$('hook'),title=$('title'),cnt=$('cnt'),crack=$('crack'),pill=$('pill');
function pop(d,amp=0.45,k=16){return d<0?1:1+amp*Math.exp(-d*k)}
function applyUI(t){
  let idx=-1;for(let i=0;i<phrases.length;i++){const p=phrases[i],n=phrases[i+1];const st=p[0][1]-0.04,en=n?n[0][1]-0.04:p[p.length-1][2]+0.3;if(t>=st&&t<en){idx=i;break}}
  if(idx<0||t>END+0.1)subEl.innerHTML='';
  else subEl.innerHTML=phrases[idx].map(w=>{const sw=isSW(w[0]);const d=t-w[1];const act=d>=0&&t<w[2]+0.1;const sc=d<0?0.001:(pop(d,sw?0.5:0.4)*(sw?1.08:1));const rot=sw&&d>=0&&d<0.4?-4*Math.exp(-d*8):0;
    return `<span class="${sw?'sw':''}" style="transform:scale(${sc}) rotate(${rot}deg);color:${act&&!sw?'#ffe600':''}">${w[0].replace(/\.\.\.|[.,¿]/g,'')}</span>`}).join('');
  // hook text
  const hk=t>=0.1&&t<HOOKEND;hook.style.display=hk?'block':'none';if(hk){const d=t-0.1;hook.style.transform=`scale(${pop(d,0.9,14)}) rotate(${-2+Math.sin(t*30)*0.6}deg)`}
  // title slam
  const T3=K('cómo');const ts=t>=T3&&t<T3+1.2;title.style.display=ts?'block':'none';if(ts){const d=t-T3;title.style.transform=`scale(${pop(d,1.4,11)}) rotate(${-4+Math.sin(t*25)*(d<0.3?2:0.4)}deg)`}
  // counter
  const nums=[[T_UNO,'1'],[T_DOS,'2'],[T_TRES,'3']];let shown=false;
  for(let i=0;i<nums.length;i++){const [s,n]=nums[i];const e=i<2?nums[i+1][0]:T_BLAST-0.2;if(t>=s&&t<e){cnt.style.display='block';cnt.textContent=n;cnt.style.transform=`scale(${pop(t-s,0.7,12)}) rotate(${(i-1)*6}deg)`;cnt.style.opacity=.92;shown=true}}
  if(!shown)cnt.style.display='none';
  // flash
  let f=0;[[POP,1],[T_BLAST,1],[T_BLAST+0.38,1],[HOOKEND,0.5]].forEach(([s,a])=>{const d=t-s;if(d>=0&&d<0.18)f=Math.max(f,a*(1-d/0.18))});
  swT.forEach(s=>{const d=t-s;if(d>=0&&d<0.1)f=Math.max(f,0.35*(1-d/0.1))});
  flash.style.opacity=f;
  // speed lines on swears + blast
  let sp=0;swT.forEach(s=>{const d=t-s;if(d>=0&&d<0.45)sp=Math.max(sp,0.8*(1-d/0.45))});
  speed.style.opacity=sp;
  // crack
  const cd=t-(T_BLAST+0.38);crack.style.opacity=cd>=0&&cd<1.3?(cd<0.9?1:1-(cd-0.9)/0.4):0;
  pill.style.display=(t>=K('cómo')+1.4&&t<K('alguien')+0.6)?'block':'none';
  endEl.style.display=t>=END+0.1?'block':'none';
  $('logo').style.display=t<END+0.1?'block':'none';
}
window.renderFrame=(tn)=>{TN=tn;const t=tn;applyHero(t);applyItems(t);applyRoom(t);applyCam(t);renderer.render(scene,cam);applyUI(tn);return true};
window.getInfo=()=>({END});
window.ready=true;
</script></body></html>
