    const lyX=0,lyY=BEDY,lyZ=LIEZ;
    let bounce=0;
    if(t>=T_BOUNCE&&t<T_BOUNCE_END){const k=t-T_BOUNCE;const per=0.72;const n=Math.floor(k/per);const amp=[5.4,4.4,3.0,1.5][Math.min(n,3)];bounce=amp*Math.abs(Math.sin(k/per*Math.PI))}
    let crush=0;if(t>=T_STAMP&&t<T_UP){crush=0.35*Math.abs(Math.sin((t-T_STAMP)*25))*(t<T_STAMP+1.8?1:0.2)}
    const sx=lerp(0,0,0);
    x=lerp(0,0,1);y=lyY+bounce-crush;z=lyZ;rx=-Math.PI/2;
    if(t>=T_BOUNCE&&t<T_BOUNCE_END){rz=0.25*Math.sin((t-T_BOUNCE)*6);}
    // stand up
    const up=eio(seg(t,T_UP,T_UP+0.9));
    x=lerp(x,0,up);y=lerp(y,0,up);z=lerp(z,3.2,up);rx=lerp(rx,0,up);
    if(t>=T_UP+0.9){walk=1}
  }
  hero.position.set(x,y,z);hero.rotation.set(rx,ry,rz);
  const wk=walk?Math.sin(t*5.5):0;
  legs.forEach((l,i)=>{const s=i?1:-1;l.th.rotation.x=0.5*wk*s;l.kn.rotation.x=0.4*Math.max(0,wk*s)});
  torsoP.rotation.x=walk?0.22:0.0;
  arms.forEach((g,i)=>{const s=i?1:-1;g.rotation.z=s*0.12;g.rotation.x=walk?-1.45+0.12*Math.sin(t*5.5+i):-0.1+0.05*Math.sin(t*1.3+i);});
  // groggy head
  const bubblesOn=t>=BUB[0].t0&&t<T_OPEN;
  headP.position.y=1.7;headP.rotation.x=walk?0.35+0.1*Math.sin(t*3):0.03*Math.sin(t*1.2);headP.rotation.z=walk?0.25*Math.sin(t*2.2):0.04*Math.sin(t*1.4);
  headP.rotation.y=0;
  // skin
  const pale=(walk&&t<T_ASI)?1:0;skinM.color.copy(SKINC).lerp(PALE,pale*0.6+0.25*seg(t,T_STAMP,T_STAMP+0.5));
  // eyes
  const dizzy=SPIRAL_ON(t);
  let blink=0;for(const b of blinks){const d=t-b;if(d>0&&d<0.14)blink=Math.sin(d/0.14*Math.PI)}
  const closed=eio(seg(t,K('cierre'),K('ojos')-0.1))*(1-seg(t,T_OPEN-0.05,T_OPEN+0.05));
  const popbulge=t>=T_OPEN&&t<T_OPEN+0.8?0.5*(1-(t-T_OPEN)/0.8):0;
  let lx=0,ly=0;
  if(t>=K('mejor')&&t<K('valió')){ // follows sheep (face up: look sideways)
    let cx=0;for(let i=0;i<3;i++){const d=t-T_C[i];if(d>-0.6&&d<0.6)cx=clamp(d*1.6,-1,1)}
    lx=cx;ly=0.3}
  const bulge=1+popbulge+(t>=K('chingados')&&t<K('valió')?0.25:0);
  eyeRig.forEach(r=>{
    r.e.scale.setScalar(bulge);
    r.lid.rotation.x=0.18+1.2*blink+1.0*closed-0.9*(t>=T_OPEN&&t<T_OPEN+0.8?1:0)-0.5*(walk?0:0);
    r.pup.visible=!dizzy;r.spiral.visible=dizzy;r.spiral.rotation.z=-t*14;
    r.pup.position.set(lx*0.1,ly*0.1,0.25);
    r.brow.rotation.z=r.s*(0.18+0.15*(t<T_ASI?1:0));r.brow.position.y=0.62;
    r.bag.scale.set(1.1,0.35+0.25*(t<T_ASI?1:0),0.45);
  });
  // mouth
  const w=wordAt(TN);let open=0;if(w)open=0.3+0.7*Math.abs(Math.sin((TN-w[1])*21));
  const slack=(t<T_ASI)?0.5:0;
  mouth.scale.set(0.3,0.03+0.2*open+0.14*slack+(t>=K('chingados')&&t<K('valió')?0.1:0),0.14);
  drool.visible=(t<T_ASI)||(t>=T_UP+0.9);drool.scale.y=0.7+0.3*Math.sin(t*6);
  hero.updateMatrixWorld(true);head.getWorldPosition(HP);hero.getWorldPosition(HEROPOS);
}

// ---------- props
function applyProps(t){
  // bed face reacts
  const sad=seg(t,K('ignora')-0.4,K('ignora')+0.2);
  bedEyes.forEach((b,i)=>{b.p.position.set(0.04*Math.sin(t*2),-0.08-0.05*sad,0.3)});
  tear.position.y=1.1-0.9*((t*0.9)%1)*(sad>0.5?1:0)+ (sad>0.5?0:0);tear.visible=sad>0.5;
  bedMouth.rotation.z=Math.PI; bedMouth.position.y=0.72;
  bedBrows.forEach((b,i)=>{b.rotation.z=(i?1:-1)*(0.25+0.4*sad)});
  bed.position.y=0;
  const bnc=t>=T_BOUNCE&&t<T_BOUNCE_END?1:0;bed.scale.y=1;
  // lamp swing
  lamp.rotation.z=0.05*Math.sin(t*1.5)+(t>=T_BOUNCE&&t<T_BOUNCE_END+0.8?0.12*Math.sin((t-T_BOUNCE)*7)*(1-seg(t,T_BOUNCE_END,T_BOUNCE_END+0.8)):0);
  // moon mouth
  moonMouth.scale.set(1,1+0.8*Math.abs(Math.sin(t*1.1)),1);
  // alarm clock
  let txt='00:00',on=true,shake=0;
  if(t>=T_CLK0){const k=seg(t,T_CLK0,T_CLK1-0.4);const s=Math.floor(k*8.99);txt='00:0'+Math.min(8,s)}
  if(t>=T_CLK1){txt='00:08';on=Math.floor(t*10)%2===0;shake=1}
  if(t>=T_UP+0.4){shake=0}
  drawClock(txt,on);
  clockG.position.set(0,1.6,0);clockG.rotation.z=shake*0.08*Math.sin(t*70);bellL.position.y=1.4+shake*0.12*Math.abs(Math.sin(t*70));bellR.position.y=1.4+shake*0.12*Math.abs(Math.cos(t*70));
  // bubbles
  BUB.forEach((b,i)=>{
    const on=t>=b.t0&&t<T_OPEN+0.12;b.m.visible=on;if(!on)return;
    const k=eback(seg(t,b.t0,b.t0+0.35));const burst=seg(t,T_OPEN-0.02,T_OPEN+0.12);
    b.m.position.set(HP.x+BOFF[i][0],HP.y+BOFF[i][1]+0.25*Math.sin(t*2+i),HP.z+BOFF[i][2]);
    b.m.quaternion.copy(cam.quaternion);b.m.scale.setScalar(Math.max(0.001,k*(1+0.8*burst)*(1-burst)));
  });
}

// ---------- sheep
const FENCE=V(0,0,5);
function sheepPose(i,t){
  const s=SHEEP[i];s.visible=false;
  const u=s.userData;
  let x,y=0,z=5.2+0.3*(i%2),ry=Math.PI/2,run=0;
  if(i<4&&t<T_STAMP){
    const c=T_C[i];if(t<c-1.1)return;
    x=(t-c)*9;
    if(i===3){ // stops at fence and glares at camera
      x=Math.min(x,-1.7);
      const stop=seg(t,c+0.18,c+0.5);ry=lerp(Math.PI/2,0.0,eio(stop));run=stop<1?1:0;
      if(stop>=1){u.head.scale.setScalar(1+0.5*seg(t,c+0.5,c+1.5));}
    }else{
      if(x>9.5)return;
      y=2.0*Math.max(0,1-Math.pow(x/2.4,2));run=1;
    }
    s.visible=true;s.position.set(x,y,z);s.rotation.y=ry;u.body.rotation.z=i<3?-0.25*Math.sin(Math.PI*clamp(1-Math.abs(x)/2.4)):0;
    u.legs.forEach((l,k)=>{l.rotation.x=run?0.9*Math.sin(t*18+(k%2)*3):0});
    return;
  }
  // stampede: run in from sides, jump onto bed, pile
  const j=i;const side=j%2?1:-1;const arr=T_STAMP+0.75+0.1*j;
  const pile=V(Math.cos(j*2.4)*1.4,2.9+0.3*(j%3),-1.0+Math.sin(j*2.4)*1.9);
  const st=V(side*(10+rnd(j)*3),0,2+rnd(j+3)*4);
  if(i===3){st.set(-1.7,0,5.2)}
  const t0=arr-1.25;
  if(t<t0)return;
  const k=clamp((t-t0)/1.25);
  const px=lerp(st.x,pile.x,eio(k)),pz=lerp(st.z,pile.z,eio(k));
  const jump=k>0.55?4.0*Math.sin(Math.PI*seg(k,0.55,1))*(1-0.4*seg(k,0.55,1)):0;
  const py=lerp(0,pile.y,seg(k,0.55,1))+jump*0.5;
  let pos=V(px,py,pz);
  // after wake-up: scatter
  const sc=t-(T_UP+0.15);if(sc>0){pos.x+=side*sc*sc*18;pos.y+=Math.max(0,3*sc-5*sc*sc);}
  if(Math.abs(pos.x)>16&&sc>0)return;
  s.visible=true;s.position.copy(pos);
  const dir=V(pile.x-st.x,0,pile.z-st.z);s.rotation.y=k<1?Math.atan2(dir.x,dir.z):0.3*j;
  u.body.rotation.z=k<1?0:0.25*Math.sin(t*20+j);
  u.legs.forEach((l,q)=>{l.rotation.x=k<1?0.9*Math.sin(t*18+(q%2)*3):0.3*Math.sin(t*9+q)});
  u.head.scale.setScalar(i===3?1.5:1);
}
function applyEffects(t){
  SHEEP.forEach((s,i)=>sheepPose(i,t));
  fence.visible=t>=K('mejor')-0.25;fence.scale.setScalar(Math.max(0.001,eback(seg(t,K('mejor')-0.25,K('mejor')+0.1))));
  dust.forEach((m,i)=>{const arr=T_STAMP+0.75+0.1*(i%10);const d=t-arr;if(d<0||d>0.9||i>=20){m.visible=false;return}
    m.visible=true;const a=i*1.9;const r=1.2+d*3.5;m.position.set(Math.cos(a)*r*1.6,2.9+d*1.6,-1.0+Math.sin(a)*r);m.scale.setScalar(0.5+d*2.4);m.material.opacity=0.75*(1-d/0.9)});
  stars.forEach((m,i)=>{const on=t>=T_STAMP+1.2&&t<K('felicidades')+0.6&&true;m.visible=on;if(!on)return;
    const a=t*7+i*1.256;m.position.set(HP.x+Math.cos(a)*1.5,HP.y+1.4,HP.z+Math.sin(a)*0.7);m.rotation.set(t*5,t*6,0)});
}

// ---------- camera
const P=(a,b,k)=>a.map((v,i)=>lerp(v,b[i],k));
const add=(v,x,y,z)=>[v.x+x,v.y+y,v.z+z];
const hpa=(x,y,z)=>add(HP,x,y,z);
const S3=()=>SHEEP[3].position;
const CUTS=[0,0.9,1.9,K('así')-0.25,T_HOOKEND,K('primero'),T_BOUNCE,K('ignora'),K('ahora',0),K('cerebro'),K('desde',1),K('mejor'),K('dos',1)-0.2,K('tres')-0.1,K('chingados'),T_STAMP-0.05,K('ya'),K('felicidades'),K('durmió'),K('ahora',1),K('váyase')-0.25];
const shots=[
 (u,t)=>({p:hpa(0.3,0.2,lerp(6.4,5.0,u)),l:hpa(0,0,0),f:36}),                                             // 0 hook zombie face
 (u,t)=>({p:P([-6,2.4,10.5],[-4,2.6,9.5],u),l:[0,3.0,2.5],f:55}),                                          // 1 wide walk
 (u,t)=>({p:P([0.5,0.8,8.2],[0,1.2,6.2],u),l:hpa(0,-0.3,0),f:48}),                                        // 2 low angle (culo)
 (u,t)=>({p:P([0,10,6],[0,8.5,5.5],u),l:[0,1.8,-1],f:50}),                                                // 3 bed top (así se duerme)
 (u,t)=>({p:P([0,4.5,15],[0,4.2,13.5],eout(u)),l:[0,2.4,-1],f:52}),                                       // 4 title
 (u,t)=>({p:P([5,3.0,8],[2,6.5,7.5],u),l:[0,2.2,-0.8],f:52}),                                             // 5 acuéstese
 (u,t)=>({p:[0,3.4,15.5],l:[0,4.6,-1],f:58}),                                                             // 6 bounce
 (u,t)=>({p:P([0,2.0,8.2],[0,1.8,6.8],u),l:[0,1.6,3.4],f:38}),                                            // 7 bed sad face
 (u,t)=>({p:P(hpa(0,4.6,1.7),hpa(0,3.6,1.3),u),l:hpa(0,0,0),f:40}),                                       // 8 eyes close
 (u,t)=>({p:P([0,5.5,16],[0,6.5,15],u),l:hpa(0,2.8,0),f:58}),                                          // 9 bubbles
 (u,t)=>({p:P(hpa(0,4.0,1.2),hpa(0,3.1,1.0),eio(u)),l:hpa(0,0,0),f:38}),                                  // 10 pop eyes
 (u,t)=>({p:[0,3.4,13.5],l:[0,2.0,2.5],f:56}),                                                            // 11 sheep wide
 (u,t)=>({p:P([2.5,1.1,9.5],[1.5,1.4,8.6],u),l:[0,1.6,5],f:50}),                                          // 12 sheep low
 (u,t)=>({p:P([-8,2.6,8.5],[-6.5,2.6,8],u),l:[0,2.0,5],f:50}),                                            // 13 side
 (u,t)=>({p:[S3().x+0.5,2.3,lerp(10.2,8.4,u)],l:[S3().x,1.7,5.4],f:36}),                                   // 14 sheep glare
 (u,t)=>({p:P([0,4.2,15],[0,4.0,12.5],u),l:[0,2.5,0],f:62}),                                              // 15 stampede
 (u,t)=>({p:P([-3,3.5,9.5],[3,4.2,10],u),l:[0,3.0,-1],f:56}),                                            // 16 pile
 (u,t)=>({p:hpa(0.2,3.6,lerp(2.6,2.0,u)),l:hpa(0,0,0),f:38}),                                             // 17 face emerges
 (u,t)=>({p:[ns.position.x-0.5,3.4,lerp(1.6,0.4,u)],l:[ns.position.x,2.4,-2.8],f:40}),                     // 18 clock
 (u,t)=>({p:P([0,4.5,15.5],[0,4,13.5],u),l:[0,2.8,1],f:54}),                                              // 19 stand up wide
 (u,t)=>({p:hpa(0.3,0.2,lerp(6.4,5.0,u)),l:hpa(0,0,0),f:36}),                                             // 20 loop face (== hook)
];
function applyCam(t){
  let si=0;for(let i=0;i<CUTS.length;i++)if(t>=CUTS[i])si=i;
  const a=CUTS[si],b=CUTS[si+1]||END+1.5;
  const u=clamp((t-a)/(b-a));const r=shots[si](u,t);
  let fov=r.f;
  for(const ts of swT){const d=TN-ts;if(d>0&&d<0.5)fov-=9*Math.exp(-d*10)}
  const dc=t-a;if(dc<0.12&&si>0)fov-=4*(1-dc/0.12);
  let sh=0;[[T_BOUNCE+0.7,0.5],[T_BOUNCE+1.45,0.5],[T_STAMP+0.9,1.3],[K('madre'),1.4],[T_CLK1,0.8],[T_OPEN,0.9]].forEach(([ts,amp])=>{const d=t-ts;if(d>0&&d<0.6)sh+=amp*Math.exp(-d*7)});
  if(t>=T_CLK1&&t<T_UP)sh+=0.35;
  cam.position.set(r.p[0]+sh*0.12*Math.sin(t*95),r.p[1]+sh*0.12*Math.cos(t*81),r.p[2]);
  cam.up.set(0,1,0);cam.lookAt(r.l[0],r.l[1],r.l[2]);
  cam.rotation.z+=(si===3||si===15||si===20)?0.06*Math.sin(t*4):0;
  cam.fov=fov;cam.updateProjectionMatrix();
}

// ---------- overlays + subtitles
const phrases=[];{let cur=[];words.forEach(w=>{cur.push(w);if(/[.?!,]|\.\.\.$/.test(w[0])||cur.length>=3){phrases.push(cur);cur=[]}});if(cur.length)phrases.push(cur)}
const $=id=>document.getElementById(id);
const subEl=$('sub'),endEl=$('end'),flash=$('flash'),speed=$('speed'),hook=$('hook'),title=$('title'),cnt=$('cnt'),pill=$('pill');
function pop(d,amp=0.45,k=16){return d<0?1:1+amp*Math.exp(-d*k)}
function applyUI(t){
  let idx=-1;for(let i=0;i<phrases.length;i++){const p=phrases[i],n=phrases[i+1];const st=p[0][1]-0.04,en=n?n[0][1]-0.04:p[p.length-1][2]+0.3;if(t>=st&&t<en){idx=i;break}}
  if(idx<0||t>END+0.1)subEl.innerHTML='';
  else subEl.innerHTML=phrases[idx].map(w=>{const sw=isSW(w[0]);const d=t-w[1];const act=d>=0&&t<w[2]+0.1;const sc=d<0?0.001:(pop(d,sw?0.5:0.4)*(sw?1.08:1));const rot=sw&&d>=0&&d<0.4?-4*Math.exp(-d*8):0;
    return `<span class="${sw?'sw':''}" style="transform:scale(${sc}) rotate(${rot}deg);color:${act&&!sw?'#ffe600':''}">${w[0].replace(/\.\.\.|[.,¿?]/g,'')}</span>`}).join('');
  const hk=t>=0.0&&t<T_HOOKEND;hook.style.display=hk?'block':'none';if(hk){hook.style.transform=`scale(${pop(t,0.3,14)}) rotate(${-2+Math.sin(t*30)*0.6}deg)`}
  const T3=K('cómo');const ts=t>=T3&&t<T3+1.4;title.style.display=ts?'block':'none';if(ts){const d=t-T3;title.style.transform=`scale(${pop(d,1.4,11)}) rotate(${-4+Math.sin(t*25)*(d<0.3?2:0.4)}deg)`}
  const nums=[[T_C[0]-0.35,'1',0.9],[K('dos',1),'2',0.9],[K('tres'),'3',0.9],[K('cuarto'),'4',1.4]];let shown=false;
  for(const [s,n,dur] of nums){if(t>=s&&t<s+dur){cnt.style.display='block';cnt.textContent=n;cnt.style.transform=`scale(${pop(t-s,0.7,12)}) rotate(${(+n-2)*5}deg)`;shown=true}}
  if(!shown)cnt.style.display='none';
  let f=0;[[T_OPEN,1],[T_STAMP+0.9,0.8],[K('madre'),1],[T_CLK1,0.6],[T_HOOKEND,0.5]].forEach(([s,a])=>{const d=t-s;if(d>=0&&d<0.18)f=Math.max(f,a*(1-d/0.18))});
  swT.forEach(s=>{const d=t-s;if(d>=0&&d<0.1)f=Math.max(f,0.35*(1-d/0.1))});
  flash.style.opacity=f;
  let sp=0;swT.forEach(s=>{const d=t-s;if(d>=0&&d<0.45)sp=Math.max(sp,0.8*(1-d/0.45))});speed.style.opacity=sp;
  pill.style.display=(t>=K('cómo')+1.5&&t<K('primero')+0.5)?'block':'none';
  endEl.style.display=t>=END+0.1?'block':'none';
  $('logo').style.display=t<END+0.1?'block':'none';
}
window.renderFrame=(tn)=>{TN=tn;const t=tn;applyHero(t);applyProps(t);applyEffects(t);applyCam(t);renderer.render(scene,cam);applyUI(tn);return true};
window.ready=true;
</script></body></html>
