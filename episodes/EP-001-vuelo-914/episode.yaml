# EP-001 — Vuelo 914 — full episode storyboard (pixel engine).
# Render: python3 tools/pixel/engine.py episodes/EP-001-vuelo-914/episode.yaml [--stills]
# Sources for every factual line: 01_INVESTIGACION.md §2 (row numbers in comments: [F1]..[F12]).
# Badges: LEYENDA · RECREACIÓN = the legend, drawn; VERIFICADO = 2 independent N2 sources;
#         SEGÚN <FUENTE> = one source, attributed; ANÁLISIS = our reading, not a fact.
# Shot cuts: `at: "palabra"` = the shot starts on that word of the line.
# music: calm | mystery | tension | reveal (original synthesised score); sfx: synthesised beds.
# To use a track from the YouTube Audio Library instead: put the file in assets/aud/ and set
#   music_file: assets/aud/<file>.mp3   (levels still follow each shot's music mood)

name: vuelo914
version: v01
voice: es-MX-JorgeNeural
rate: "-6%"
lead: 0.05

lines:
